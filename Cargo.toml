[package]
name = "photonic-router"
version = "0.1.0"
edition = "2021"
description = "Rust foundations for a photonic grid router"

[lib]
name = "photonic_router"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py38"] }
rustc-hash = "2"

[lints.clippy]
# Phase-3 debt of the do-over (working/.agent/TUMPhotonicRouter/DO_OVER_ANALYSIS.md):
# 40 functions take 8 to 21 positional arguments that one typed request struct
# will replace, and 9 signatures spell out tuple types that struct will name.
# Allowed here so that every other warning is a failure in CI.
too_many_arguments = "allow"
type_complexity = "allow"
