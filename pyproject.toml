[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "photonic-router-rs"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gdsfactory>=9.43,<10",
    "klayout>=0.30,<0.31",
    "numpy>=2,<3",
    "PyYAML>=6,<7",
    "shapely>=2.1,<3",
]

[project.optional-dependencies]
# Dev-only tooling, not a runtime dependency of the photonic_router package.
# Install with `.venv/bin/pip install -e ".[dev]"`.
dev = ["ruff>=0.16,<0.17", "mypy>=2.3,<2.4"]

[tool.maturin]
# The extension is the `router-py` crate of the Cargo workspace (phase 8
# slice B); `router-core` is the pure-Rust engine it wraps.
manifest-path = "crates/router-py/Cargo.toml"
module-name = "photonic_router._rust"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
# The agent-process layer keeps historical plans and prototypes as written.
extend-exclude = [".agent"]
target-version = "py310"

[tool.ruff.lint]
# A deliberately moderate starting set, not ruff's maximal `select = ["ALL"]`
# -- see .agent/execplans/2026-08-25-python-rust-linting-and-coding-standards.md's
# Decision Log for why. Widen this over time (Milestone 4 of that plan) as
# each newly-enabled category's findings are fixed or explicitly suppressed,
# not enabled all at once.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports/variables, ...)
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade (modern syntax this repo's requires-python already allows)
    "B",    # flake8-bugbear (likely-bug patterns)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff's own additional rules
    "ISC",  # implicit string concatenation
    "PIE",  # misc. lint rules (flake8-pie)
    "PYI",  # typing-stub-style rules, useful even outside .pyi files
    "TRY",  # exception-handling patterns
    "FURB", # modernize (refurb)
]
ignore = [
    # single-line-implicit-string-concatenation: conflicts with the
    # formatter's own line-joining behavior.
    "ISC001",
    # raise-vanilla-args: this repository deliberately raises rich,
    # specific runtime error messages built from local context (net name,
    # coordinates, blocker sets, ...) rather than a small fixed set of
    # exception classes -- that is the established, correct style here
    # (see any routing-failure RuntimeError in python/photonic_router/routing/route_rust.py),
    # not something to fight. 162 of this rule set's 994-finding baseline
    # (2026-08-25) were this one rule before it was added here.
    "TRY003",
    # line-too-long: `ruff format` owns line length; what it leaves over 100
    # columns is a string literal or a URL that wrapping would make worse.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Scripts and the two shims insert the repository root into sys.path before
# importing from it, so their imports cannot be at the top of the file.
"scripts/**" = ["E402"]
"python/photonic_router/routing/route_rust.py" = ["E402"]
"python/photonic_router/__init__.py" = ["E402"]
# The 2026-09 path-investigation harness is exploratory code kept as the
# record of that investigation (.agent/PATH_INVESTIGATION_HARNESS.md); it is
# not held to the package's naming and resource rules.
"scripts/path_investigation/*" = ["E741", "B007", "F841", "F821", "SIM115", "E731"]
# Test fakes use plain class attributes as fixtures on purpose.
"tests/**" = ["RUF012"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
# Deliberately not `strict = true` yet: a baseline scoping pass (2026-08-25)
# found 246 errors in just the former top-level package and routing_flow.py, most from the
# untyped PyO3 boundary (photonic_router._rust ships no type stub, so mypy
# sees every value it returns as `object`/`Any`). Tightening this is tracked
# as a Milestone 4 candidate in the ExecPlan referenced above, not silently
# deferred with no record.
files = [
    "python/photonic_router/routing",
    "python/photonic_router/electrical",
    "python/photonic_router/crossings",
    "python/photonic_router/plm",
    "python/photonic_router/verify",
    "python/photonic_router/gds",
    "python/photonic_router/records",
    "routing_flow.py",
    "python/photonic_router/flow_config.py",
]
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
markers = [
    "e2e: loads a benchmark module or a script and runs it end to end",
    "integration: several stages or the Rust router on a synthetic layout, or benchmark schematics without routing",
]
testpaths = ["tests"]
