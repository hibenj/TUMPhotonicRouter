[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "photonic-router-rs"
version = "0.1.0"
description = "Grid-based photonic waveguide router for gdsfactory schematics: A* with legal crossings, negotiated rip-up, pre-placed crossing grids, path-length matching and heater electrical routing (Rust core, Python flow)."
readme = "README.md"
# CI runs 3.12 only; the CLI uses tomllib (3.11+).
requires-python = ">=3.12"
# TODO owner: authors (names, e-mail addresses, affiliation).
authors = [{ name = "TODO owner" }]
# MIT (owner decision 20, 2026-11-05); LICENSE names the authors collectively --
# TODO owner: set the legal copyright holder there.
license = "MIT"
keywords = [
    "photonics",
    "photonic integrated circuits",
    "waveguide routing",
    "EDA",
    "gdsfactory",
    "A* search",
    "rip-up and reroute",
    "path-length matching",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "gdsfactory>=9.43,<10",
    "klayout>=0.30,<0.31",
    "numpy>=2,<3",
    "PyYAML>=6,<7",
    "scipy>=1.13,<2",
    "shapely>=2.1,<3",
]

[project.urls]
Repository = "https://github.com/hibenj/TUMPhotonicRouter"

[project.optional-dependencies]
# Dev-only tooling, not a runtime dependency of the photonic_router package.
# Install with `.venv/bin/pip install -e ".[dev]"`.
dev = ["ruff>=0.16,<0.17", "mypy>=2.3,<2.4", "types-shapely>=2.1"]

[tool.maturin]
# The extension is the `router-py` crate of the Cargo workspace (phase 8
# slice B); `router-core` is the pure-Rust engine it wraps.
manifest-path = "crates/router-py/Cargo.toml"
module-name = "photonic_router._rust"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# A deliberately moderate starting set, not ruff's maximal `select = ["ALL"]`
# -- see the 2026-08-25 linting plan in the private agent-process layer (outside
# the public tree since 2026-11-05) for why. Widen this over time (Milestone 4 of that plan) as
# each newly-enabled category's findings are fixed or explicitly suppressed,
# not enabled all at once.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports/variables, ...)
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade (modern syntax this repo's requires-python already allows)
    "B",    # flake8-bugbear (likely-bug patterns)
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff's own additional rules
    "ISC",  # implicit string concatenation
    "PIE",  # misc. lint rules (flake8-pie)
    "PYI",  # typing-stub-style rules, useful even outside .pyi files
    "TRY",  # exception-handling patterns
    "FURB", # modernize (refurb)
    "TID252", # relative imports (docs/CODING_STANDARDS.md rule 4.10)
    "ANN001", # rule 4.2: every parameter is annotated ...
    "ANN201", # ... and every public function ...
    "ANN202", # ... and private function declares its return type
    "D100",   # rule 4.7: every public module,
    "D101",   # class,
    "D102",   # method,
    "D103",   # function
    "D104",   # and package of the package has a docstring
    "ARG001", # rule 4.11: a function reads every parameter it takes
    "T201",   # rule 4.6: the package reports through logging, not print
    "BLE001", # rule 4.9: no blind except in the package
    "PLR0915", # rule 4.5: a function of the package has at most 50 statements
]
ignore = [
    # single-line-implicit-string-concatenation: conflicts with the
    # formatter's own line-joining behavior.
    "ISC001",
    # raise-vanilla-args: this repository deliberately raises rich,
    # specific runtime error messages built from local context (net name,
    # coordinates, blocker sets, ...) rather than a small fixed set of
    # exception classes -- that is the established, correct style here
    # (see any routing-failure RuntimeError in python/photonic_router/routing/),
    # not something to fight. 162 of this rule set's 994-finding baseline
    # (2026-08-25) were this one rule before it was added here.
    "TRY003",
    # line-too-long: `ruff format` owns line length; what it leaves over 100
    # columns is a string literal or a URL that wrapping would make worse.
    "E501",
]

[tool.ruff.lint.flake8-tidy-imports]
# Rule 4.10: imports are absolute, also from a sibling module.
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Scripts and the two shims insert the repository root into sys.path before
# importing from it, so their imports cannot be at the top of the file.
# Rules 4.2 (annotations), 4.5 (the statement limit) and 4.7 (docstrings)
# are about the package.
"scripts/**" = ["E402", "ANN", "D", "ARG001", "T201", "BLE001", "PLR0915"]
"python/photonic_router/__init__.py" = ["E402"]
# The command line prints what it applied before the run configures anything.
"python/photonic_router/cli.py" = ["T201"]
# A benchmark module run as a program shows its schematic, and the table
# scripts of the experiments print their tables.
"benchmarks/**" = ["T201", "PLR0915"]
"experiments/*.py" = ["T201", "PLR0915"]
# The 2026-09 path-investigation harness is exploratory code kept as the
# record of that investigation (PATH_INVESTIGATION_HARNESS.md in the private
# agent-process layer); it is
# not held to the package's naming and resource rules.
"scripts/path_investigation/*" = ["E741", "B007", "F841", "F821", "SIM115", "E731"]
# Test fakes use plain class attributes as fixtures on purpose, and a
# stub takes the parameters of what it stands in for.
"tests/**" = ["RUF012", "ANN", "D", "ARG001", "T201", "BLE001", "PLR0915"]
# Measurement scripts of closed experiments (experiments/README.md) are kept
# as written for their record; they patch the flow in place after inserting
# the repository root into sys.path.
"experiments/*/scripts/*" = ["E402", "C401", "C408", "SIM105", "E741", "ANN", "D", "ARG001", "T201", "BLE001", "PLR0915"]

# The limits of docs/CODING_STANDARDS.md section 4. PLR0915 (statements) is
# selected above. PLR0913 and C901 are not yet: scripts/quality_ratchet.py
# counts their findings and holds the counts until they reach zero.
[tool.ruff.lint.pylint]
max-args = 7
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
# docs/CODING_STANDARDS.md rule 4.2: mypy passes on the whole package
# (scripts/lint.sh and CI run it). Not `strict = true`: the PyO3 boundary
# is typed by Protocols at its callers, and tests are not checked.
files = ["python/photonic_router", "routing_flow.py"]
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# scipy has no type information; the logic harness labels free areas with it
# (logic_checks/route_jobs.py).
module = "scipy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "e2e: loads a benchmark module or a script and runs it end to end",
    "integration: several stages or the Rust router on a synthetic layout, or benchmark schematics without routing",
]
testpaths = ["tests"]
