# Default flags and configuration overlay of permutation_synthetic (the former STABLE_ROUTING_* block); CLI flags override, the process environment wins for [config].
#
# The multiportmmi stable block: static stubs for dense port groups and the
# lidar-pure crossing search for the baseline control; grid mode drops the
# crossing flags itself.

[flags]
crossings = true
crossing-mode = "lidar-pure"
fanout-access-mode = "static-stubs"
# --routing-window-scale 0.35 removed 2026-08-31: the CLI default
# 0.05 routes identically clean and 15-30% faster (heuristics-audit
# experiments, .agent/execplans/2026-08-31-engine-performance-baseline.md).
foreign-port-keepout-cells = 0
proactive-congestion-weight = 4.0
proactive-congestion-radius-cells = 3

[config]
LONG_STRAIGHT_CONGESTION_WEIGHT = "0.05"
FANOUT_STUB_BEND_DEGREES = "90"
